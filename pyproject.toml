[project]
name = "home-work-14-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex",email = "hopiru@mail.ru"}
]
requires-python = ">=3.14"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)"
]

[tool.poetry]
packages = [{include = "home_work_14"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''/( \.git, .hg, .tox )/'''
[tool.isort]
profile = "black"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true

[tool.flake8]
max-line-length=119